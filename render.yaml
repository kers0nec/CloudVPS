services:
  - type: web
    name: cloudvps
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: API_RATE_LIMIT
        value: 5000
      - key: ENABLE_SWAGGER
        value: false
      - key: PERSIST_DIR
        value: /var/data
    # CRITICAL: without a persistent disk, every redeploy/restart runs on a
    # brand-new, empty filesystem — the account database and every VPS
    # workspace are wiped. This is very likely the real cause behind reports
    # of the platform "logging everyone out" and "deleting accounts": the
    # previous config (Python + gunicorn, no disk section at all) had
    # nothing durable to persist to, so a routine redeploy or dyno restart
    # looked identical to `rm -rf data/ vps_instances/`. PERSIST_DIR points
    # both the account database AND every VPS workspace at this one mount.
    disk:
      name: cloudvps-data
      mountPath: /var/data
      sizeGB: 1
