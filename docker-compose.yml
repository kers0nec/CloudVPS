version: '3.8'

services:
  cloudvps:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:3000
      - API_RATE_LIMIT=100
      # - GEMINI_API_KEY=your-key-here
      # - DISCORD_BOT_TOKEN=your-token-here
    volumes:
      - ./data:/app/data
      - ./vps_instances:/app/vps_instances
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { if (res.statusCode !== 200) process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development service with hot reload
  cloudvps-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FRONTEND_URL=http://localhost:3001
    volumes:
      - ./:/app
      - /app/node_modules
      - ./data:/app/data
      - ./vps_instances:/app/vps_instances
    # Launcher runs API + host-node daemon together (scripts/start-all.js)
    command: npm start
    profiles:
      - dev