<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Vps</title>
  <meta name="description" content="Cloud Vps — Discord bot hosting and VPS workspace.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M41.5052 15.1655C45.3542 8.49886 54.9767 8.49886 58.8257 15.1655L84.8064 60.1655C88.6554 66.8322 83.8442 75.1655 76.1462 75.1655H24.1847C16.4867 75.1655 11.6754 66.8322 15.5244 60.1655L41.5052 15.1655Z' fill='%23972577'/%3E%3Cpath d='M61.9647 16.0953C68.8237 12.6005 76.8938 17.8413 76.4909 25.5287L73.7715 77.419C73.3686 85.1065 64.7949 89.475 58.3388 85.2824L14.7602 56.9821C8.30411 52.7895 8.80771 43.1802 15.6667 39.6853L61.9647 16.0953Z' fill='%23BD2E95'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0d0f12;
      --panel: #14171c;
      --panel-2: #1a1e24;
      --input-bg: #0f1216;
      --border: #262c35;
      --border-soft: #1f242c;
      --text: #e7eaee;
      --muted: #99a2ae;
      --dim: #6b7480;
      --accent: #5865f2;
      --accent-hover: #4a56dd;
      --green: #3fb950;
      --red: #e5534b;
      --amber: #d9a23a;
      --radius: 10px;
      --radius-sm: 7px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, select, textarea { font: inherit; color: var(--text); }
    ::placeholder { color: var(--dim); }

    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ---------- Sidebar ---------- */
    #sidebar {
      width: 212px;
      min-width: 212px;
      background: #101318;
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 16px 16px 14px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .brand svg { flex-shrink: 0; }
    #nav { padding: 4px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
    }
    .nav-btn:hover { background: var(--panel-2); color: var(--text); }
    .nav-btn.active { background: var(--panel-2); color: var(--text); }
    .nav-btn svg { flex-shrink: 0; opacity: 0.85; }
    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--border-soft);
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      background: var(--panel);
      border: 1px solid var(--border-soft);
    }
    .user-avatar {
      width: 26px; height: 26px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .user-pill .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-pill .sub { font-size: 11px; color: var(--muted); }
    .footer-actions { display: flex; gap: 8px; }

    /* ---------- Main ---------- */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #topbar {
      height: 53px;
      min-height: 53px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-soft);
      background: rgba(13, 15, 18, 0.6);
    }
    #page-title { font-size: 14.5px; font-weight: 600; }
    #page-actions { display: flex; gap: 8px; align-items: center; }
    #content { flex: 1; overflow-y: auto; padding: 20px; }
    .view { display: none; max-width: 1100px; margin: 0 auto; }
    .view.active { display: block; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 16px;
    }
    .card + .card { margin-top: 14px; }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--panel-2);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover { background: #21262e; }
    .btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: #1d6b3c; border-color: #24804a; color: #d7f5e1; }
    .btn-success:hover { background: #227a45; }
    .btn-danger { background: transparent; border-color: rgba(229, 83, 75, 0.4); color: var(--red); }
    .btn-danger:hover { background: rgba(229, 83, 75, 0.1); }
    .btn-sm { height: 27px; padding: 0 10px; font-size: 12.5px; }
    .btn-icon {
      width: 26px; height: 26px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--muted);
      border: 1px solid transparent;
    }
    .btn-icon:hover { background: var(--panel-2); color: var(--text); border-color: var(--border); }

    /* ---------- Forms ---------- */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .input, select.input, textarea.input {
      width: 100%;
      height: 34px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 11px;
      font-size: 13.5px;
      outline: none;
    }
    textarea.input { height: auto; padding: 9px 11px; resize: vertical; }
    .input:focus, select.input:focus, textarea.input:focus { border-color: var(--accent); }
    select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
    .input-row { display: flex; gap: 8px; }
    .input-row .input { flex: 1; min-width: 0; }
    .hint { font-size: 12px; color: var(--dim); margin-top: 6px; }

    /* ---------- Stat strip ---------- */
    .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 800px) { .stat-strip { grid-template-columns: repeat(2, 1fr); } }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 11px 14px;
    }
    .stat .k { font-size: 11.5px; color: var(--muted); font-weight: 500; }
    .stat .v { font-size: 13.5px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .s { font-size: 11.5px; color: var(--dim); }

    /* ---------- VPS list ---------- */
    .vps-card {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .vps-card + .vps-card { margin-top: 10px; }
    .vps-main { flex: 1; min-width: 0; }
    .vps-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .vps-specs { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .vps-specs .ip { font-family: var(--mono); font-size: 12px; }
    .vps-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 700px) { .vps-card { flex-direction: column; align-items: stretch; } .vps-actions { justify-content: flex-start; } }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; display: inline-block; }
    .dot.on { background: var(--green); }
    .dot.err { background: var(--red); }
    .status-text { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

    /* ---------- Empty state ---------- */
    .empty {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 42px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty h3 { font-size: 14.5px; color: var(--text); font-weight: 600; margin-bottom: 5px; }
    .empty p { font-size: 13px; margin-bottom: 14px; }

    /* ---------- Dropzone ---------- */
    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 22px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      background: var(--panel);
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(88, 101, 242, 0.05); }
    .dropzone .dz-title { color: var(--text); font-weight: 500; font-size: 13.5px; }
    .dropzone .dz-sub { font-size: 12px; margin-top: 3px; }

    /* ---------- File tree ---------- */
    .tree { font-size: 13px; }
    .tree-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
    }
    .tree-row:hover { background: var(--panel-2); color: var(--text); }
    .tree-row.selected { background: rgba(88, 101, 242, 0.14); color: var(--text); }
    .tree-row .t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-row .t-meta { font-size: 11.5px; color: var(--dim); flex-shrink: 0; }
    .tree-row .t-actions { display: none; gap: 2px; flex-shrink: 0; }
    .tree-row:hover .t-actions { display: inline-flex; }
    .tree-empty { color: var(--dim); font-size: 12.5px; padding: 10px 4px; }

    /* ---------- Editor ---------- */
    #editor-wrap { display: none; }
    #editor-wrap.open { display: block; }
    .editor-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .editor-head .fname { font-family: var(--mono); font-size: 12.5px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); display: none; }
    .dirty-dot.show { display: block; }
    #file-editor {
      width: 100%;
      min-height: 300px;
      background: #0b0d10;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      color: #dfe3e8;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      padding: 12px;
      outline: none;
      resize: vertical;
      tab-size: 4;
    }
    #file-editor:focus { border-color: var(--accent); }

    /* ---------- Logs ---------- */
    .log-box {
      background: #0b0d10;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      color: #c8cdd4;
      padding: 10px 12px;
      height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-box:empty::before { content: "No logs yet. Start the bot to see output here."; color: var(--dim); }

    /* ---------- Account ---------- */
    .account-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); }
    .account-row:last-child { border-bottom: none; }
    .account-row .k { font-size: 13px; color: var(--muted); }
    .account-row .v { font-size: 13px; font-weight: 500; font-family: var(--mono); word-break: break-all; text-align: right; }

    /* ---------- Modal ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.66);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .modal h2 { font-size: 15.5px; font-weight: 600; margin-bottom: 14px; }
    .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal-error { display: none; font-size: 12.5px; color: var(--red); background: rgba(229, 83, 75, 0.09); border: 1px solid rgba(229, 83, 75, 0.3); border-radius: var(--radius-sm); padding: 7px 10px; margin-bottom: 12px; }
    .auth-tabs { display: flex; gap: 4px; background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 14px; }
    .auth-tabs button { flex: 1; height: 28px; border-radius: 5px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
    .auth-tabs button.active { background: var(--panel-2); color: var(--text); }

    /* ---------- Toasts ---------- */
    #toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: 360px; }
    .toast {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toast-in 0.15s ease;
    }
    .toast.ok { border-left-color: var(--green); }
    .toast.err { border-left-color: var(--red); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (max-width: 760px) {
      #sidebar { width: 62px; min-width: 62px; }
      .brand span, .nav-btn span, .user-pill .info { display: none; }
      .brand { justify-content: center; padding: 16px 8px 14px; }
      .nav-btn { justify-content: center; padding: 9px 0; }
      .user-pill { justify-content: center; padding: 6px; }
      .footer-actions { justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none">
          <path d="M41.5052 15.1655C45.3542 8.49886 54.9767 8.49886 58.8257 15.1655L84.8064 60.1655C88.6554 66.8322 83.8442 75.1655 76.1462 75.1655H24.1847C16.4867 75.1655 11.6754 66.8322 15.5244 60.1655L41.5052 15.1655Z" fill="#972577"/>
          <path d="M61.9647 16.0953C68.8237 12.6005 76.8938 17.8413 76.4909 25.5287L73.7715 77.419C73.3686 85.1065 64.7949 89.475 58.3388 85.2824L14.7602 56.9821C8.30411 52.7895 8.80771 43.1802 15.6667 39.6853L61.9647 16.0953Z" fill="#BD2E95"/>
        </svg>
        <span>Cloud Vps</span>
      </div>

      <nav id="nav">
        <button class="nav-btn active" data-tab="vps" onclick="switchTab('vps')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>My Vps</span>
        </button>
        <button class="nav-btn" data-tab="bot" onclick="switchTab('bot')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="11"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg>
          <span>Dc Bots</span>
        </button>
        <button class="nav-btn" data-tab="account" onclick="switchTab('account')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Account</span>
        </button>
      </nav>

      <div class="sidebar-footer" id="sidebar-footer">
        <!-- filled by JS -->
      </div>
    </aside>

    <div id="main">
      <header id="topbar">
        <div id="page-title">My Vps</div>
        <div id="page-actions"></div>
      </header>

      <div id="content">
        <!-- ============ MY VPS ============ -->
        <section class="view active" id="view-vps">
          <div class="stat-strip" id="hw-strip" style="display:none;">
            <div class="stat"><div class="k">CPU</div><div class="v" id="hw-cpu">—</div><div class="s" id="hw-cpu-sub">—</div></div>
            <div class="stat"><div class="k">Memory</div><div class="v" id="hw-ram">—</div><div class="s" id="hw-ram-sub">—</div></div>
            <div class="stat"><div class="k">Platform</div><div class="v" id="hw-platform">—</div><div class="s" id="hw-platform-sub">—</div></div>
            <div class="stat"><div class="k">Server Uptime</div><div class="v" id="hw-uptime">—</div><div class="s" id="hw-uptime-sub">Online</div></div>
          </div>
          <div id="vps-list"></div>
        </section>

        <!-- ============ DC BOTS ============ -->
        <section class="view" id="view-bot">
          <div id="bot-empty"></div>

          <div id="bot-body" style="display:none;">
            <div class="card" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
              <div class="field" style="margin:0; flex:1; min-width:180px;">
                <label style="margin-bottom:4px;">VPS</label>
                <select class="input" id="bot-vps-select" onchange="setBotVps(this.value)"></select>
              </div>
              <div style="display:flex; align-items:center; gap:14px; padding-top:18px; flex-wrap:wrap;">
                <span class="status-text"><span class="dot" id="bot-status-dot"></span><span id="bot-status-text">Stopped</span></span>
                <span class="status-text" id="bot-uptime-text" style="display:none;"></span>
              </div>
            </div>

            <div class="card" style="margin-top:14px;">
              <div class="card-title">Upload Files</div>
              <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
                <div class="dz-title">Click or drag files here</div>
                <div class="dz-sub">Zip files are extracted automatically</div>
              </div>
              <input type="file" id="file-input" multiple style="display:none" onchange="uploadFiles(this.files); this.value='';">
            </div>

            <div class="grid-2" style="margin-top:14px;">
              <div class="card">
                <div class="card-title">
                  <span>Files</span>
                  <span style="display:flex; gap:6px;">
                    <button class="btn btn-sm" onclick="newFile()">New File</button>
                    <button class="btn btn-sm" onclick="newFolder()">New Folder</button>
                  </span>
                </div>
                <div class="tree" id="file-tree"></div>
              </div>

              <div class="card">
                <div class="card-title">Bot</div>
                <div class="field">
                  <label for="bot-script">Script</label>
                  <div class="input-row">
                    <input type="text" class="input" id="bot-script" placeholder="bot.py" spellcheck="false">
                    <select class="input" id="bot-runtime" style="width:110px; flex:none;" title="Runtime">
                      <option value="python">python</option>
                      <option value="node">node</option>
                      <option value="bash">bash</option>
                    </select>
                  </div>
                </div>
                <div class="field">
                  <label for="bot-token">Discord Token</label>
                  <div class="input-row">
                    <input type="password" class="input" id="bot-token" placeholder="Paste token" autocomplete="off" spellcheck="false">
                    <button class="btn" onclick="toggleToken()" id="token-eye" title="Show / hide">Show</button>
                  </div>
                  <div class="hint" id="token-hint">Left empty, the saved token is used.</div>
                </div>
                <div class="field" style="margin-bottom:0;">
                  <label for="bot-token-type">Token Type</label>
                  <select class="input" id="bot-token-type">
                    <option value="bot">Bot token</option>
                    <option value="user">User token</option>
                  </select>
                </div>
                <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;">
                  <button class="btn btn-success" id="btn-start" onclick="startBot()">Start</button>
                  <button class="btn" id="btn-restart" onclick="restartBot()">Restart</button>
                  <button class="btn btn-danger" id="btn-stop" onclick="stopBot()">Stop</button>
                </div>
              </div>
            </div>

            <div class="card" id="editor-card" style="display:none;">
              <div class="editor-head">
                <span class="fname" id="editor-fname"></span>
                <span class="dirty-dot" id="editor-dirty"></span>
                <button class="btn btn-sm" onclick="deleteEditorFile()">Delete</button>
                <button class="btn btn-sm btn-primary" onclick="saveEditorFile()">Save</button>
              </div>
              <textarea id="file-editor" spellcheck="false" oninput="markDirty()"></textarea>
            </div>

            <div class="card" style="margin-top:14px;">
              <div class="card-title">
                <span>Logs</span>
                <span style="display:flex; gap:6px;">
                  <button class="btn btn-sm" onclick="clearLogs()">Clear</button>
                </span>
              </div>
              <div class="log-box" id="log-box"></div>
            </div>
          </div>
        </section>

        <!-- ============ ACCOUNT ============ -->
        <section class="view" id="view-account">
          <div id="account-body"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- Auth modal -->
  <div class="modal-backdrop" id="auth-backdrop" onclick="if (event.target === this) closeAuth()">
    <div class="modal">
      <h2 id="auth-title">Sign In</h2>
      <div class="modal-error" id="auth-error"></div>
      <div class="auth-tabs">
        <button id="tab-login" onclick="setAuthMode('login')">Sign In</button>
        <button id="tab-signup" class="active" onclick="setAuthMode('signup')">Create Account</button>
      </div>
      <div class="field">
        <label for="auth-username">Username</label>
        <input type="text" class="input" id="auth-username" autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input type="password" class="input" id="auth-password" autocomplete="current-password">
      </div>
      <div class="field" id="auth-confirm-field">
        <label for="auth-confirm">Confirm Password</label>
        <input type="password" id="auth-confirm" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="auth-submit" style="width:100%;" onclick="submitAuth()">Create Account</button>
    </div>
  </div>

  <!-- Create VPS modal -->
  <div class="modal-backdrop" id="vps-backdrop" onclick="if (event.target === this) closeVpsModal()">
    <div class="modal">
      <h2>Create VPS</h2>
      <div class="modal-error" id="vps-error"></div>
      <div class="field">
        <label for="vps-name">Name</label>
        <input type="text" class="input" id="vps-name" placeholder="my-bot-vps" maxlength="40" spellcheck="false">
      </div>
      <div class="field">
        <label for="vps-plan">Plan</label>
        <select class="input" id="vps-plan"></select>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeVpsModal()">Cancel</button>
        <button class="btn btn-primary" id="vps-create-btn" onclick="createVps()">Create</button>
      </div>
    </div>
  </div>

  <!-- Prompt modal -->
  <div class="modal-backdrop" id="prompt-backdrop">
    <div class="modal">
      <h2 id="prompt-title">Name</h2>
      <div class="field" style="margin-bottom:0;">
        <input type="text" class="input" id="prompt-input" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button class="btn" id="prompt-cancel">Cancel</button>
        <button class="btn btn-primary" id="prompt-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-backdrop" id="confirm-backdrop">
    <div class="modal">
      <h2 id="confirm-title">Confirm</h2>
      <p id="confirm-message" style="font-size:13.5px; color:var(--muted);"></p>
      <div class="modal-actions">
        <button class="btn" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script>
    'use strict';

    /* ================= STATE ================= */
    const STATE = {
      user: null,
      vpsList: [],
      activeVpsId: null,      // VPS selected in Dc Bots
      tab: 'vps',
      bot: null,
      files: [],
      collapsed: new Set(),
      editorPath: null,
      editorDirty: false,
      plans: {},
      logTimer: null,
      statusTimer: null,
      netFailNotified: false,
    };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    /* ================= API ================= */
    function authHeaders() {
      const key = (STATE.user && STATE.user.api_key) || localStorage.getItem('cloudvps_key') || '';
      const h = {};
      if (key) { h['X-API-Key'] = key; h['Authorization'] = 'Bearer ' + key; }
      return h;
    }

    async function api(path, opts = {}) {
      opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
      if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      let res;
      try {
        res = await fetch(path, opts);
      } catch (e) {
        if (!STATE.netFailNotified) {
          STATE.netFailNotified = true;
          toast('Cannot reach the server. Check your connection.', 'err');
          setTimeout(() => { STATE.netFailNotified = false; }, 8000);
        }
        return { ok: false, status: 0, data: {} };
      }
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (res.status === 401) {
        STATE.user = null;
        localStorage.removeItem('cloudvps_key');
        renderSidebar();
        switchTab('vps');
      }
      return { ok: res.ok, status: res.status, data };
    }

    /* ================= TOASTS ================= */
    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
      el.textContent = msg;
      $('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 260); }, 3400);
    }

    /* ================= MODALS ================= */
    function promptModal(title, placeholder, defaultValue = '') {
      return new Promise((resolve) => {
        const bd = $('prompt-backdrop');
        $('prompt-title').textContent = title;
        const input = $('prompt-input');
        input.value = defaultValue;
        input.placeholder = placeholder || '';
        input.style.display = '';
        bd.classList.add('open');
        setTimeout(() => { input.focus(); input.select(); }, 30);

        const close = (val) => {
          bd.classList.remove('open');
          $('prompt-ok').onclick = null;
          $('prompt-cancel').onclick = null;
          input.onkeydown = null;
          resolve(val);
        };
        $('prompt-ok').onclick = () => close(input.value);
        $('prompt-cancel').onclick = () => close(null);
        input.onkeydown = (e) => {
          if (e.key === 'Enter') close(input.value);
          if (e.key === 'Escape') close(null);
        };
      });
    }

    function confirmModal(title, message, okLabel = 'Delete') {
      return new Promise((resolve) => {
        const bd = $('confirm-backdrop');
        $('confirm-title').textContent = title;
        $('confirm-message').textContent = message;
        $('confirm-ok').textContent = okLabel;
        bd.classList.add('open');
        const close = (val) => {
          bd.classList.remove('open');
          $('confirm-ok').onclick = null;
          $('confirm-cancel').onclick = null;
          resolve(val);
        };
        $('confirm-ok').onclick = () => close(true);
        $('confirm-cancel').onclick = () => close(false);
      });
    }

    /* ================= TABS ================= */
    function switchTab(tab) {
      STATE.tab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      $('view-' + tab).classList.add('active');
      $('page-title').textContent = tab === 'vps' ? 'My Vps' : tab === 'bot' ? 'Dc Bots' : 'Account';

      const actions = $('page-actions');
      actions.innerHTML = '';
      stopLogPolling();
      if (STATE.statusTimer) { clearInterval(STATE.statusTimer); STATE.statusTimer = null; }

      if (tab === 'vps') {
        const b = document.createElement('button');
        b.className = 'btn btn-primary';
        b.textContent = '+ Create VPS';
        b.onclick = openVpsModal;
        actions.appendChild(b);
        loadVpsList();
        loadHardware();
      } else if (tab === 'bot') {
        loadBotTab();
      } else if (tab === 'account') {
        renderAccount();
      }
    }

    /* ================= SIDEBAR / AUTH ================= */
    function renderSidebar() {
      const footer = $('sidebar-footer');
      if (STATE.user) {
        footer.innerHTML = `
          <div class="user-pill">
            <div class="user-avatar">${esc((STATE.user.username || '?')[0].toUpperCase())}</div>
            <div class="info">
              <div class="name">${esc(STATE.user.username)}</div>
              <div class="sub">Signed in</div>
            </div>
          </div>`;
      } else {
        footer.innerHTML = `
          <div class="footer-actions">
            <button class="btn btn-sm" style="flex:1;" onclick="openAuth('login')">Sign In</button>
            <button class="btn btn-sm btn-primary" style="flex:1;" onclick="openAuth('signup')">Sign Up</button>
          </div>`;
      }
    }

    let authMode = 'signup';
    function openAuth(mode = 'signup') {
      setAuthMode(mode);
      $('auth-error').style.display = 'none';
      $('auth-backdrop').classList.add('open');
      setTimeout(() => $('auth-username').focus(), 30);
    }
    function closeAuth() { $('auth-backdrop').classList.remove('open'); }

    function setAuthMode(mode) {
      authMode = mode;
      $('tab-login').classList.toggle('active', mode === 'login');
      $('tab-signup').classList.toggle('active', mode === 'signup');
      $('auth-title').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      $('auth-confirm-field').style.display = mode === 'signup' ? '' : 'none';
      $('auth-submit').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      $('auth-error').style.display = 'none';
    }

    async function submitAuth() {
      const username = $('auth-username').value.trim();
      const password = $('auth-password').value;
      const confirm = $('auth-confirm').value;
      const errEl = $('auth-error');
      errEl.style.display = 'none';

      if (!username || username.length < 3) return showAuthError('Username must be at least 3 characters.');
      if (!password || password.length < 6) return showAuthError('Password must be at least 6 characters.');
      if (authMode === 'signup' && password !== confirm) return showAuthError('Passwords do not match.');

      const btn = $('auth-submit');
      btn.disabled = true;
      const res = await api(authMode === 'login' ? '/api/login' : '/api/register', {
        method: 'POST',
        body: { username, password }
      });
      btn.disabled = false;

      if (res.ok && res.data.success) {
        localStorage.setItem('cloudvps_key', res.data.api_key);
        STATE.user = { id: res.data.user_id, username: res.data.username, api_key: res.data.api_key };
        closeAuth();
        $('auth-password').value = '';
        $('auth-confirm').value = '';
        renderSidebar();
        toast('Signed in as ' + STATE.user.username, 'ok');
        switchTab(STATE.tab);
      } else {
        showAuthError(res.data.error || 'Authentication failed. Check your details.');
      }
    }

    function showAuthError(msg) {
      const el = $('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function signOut() {
      await api('/api/logout', { method: 'POST' });
      localStorage.removeItem('cloudvps_key');
      STATE.user = null;
      renderSidebar();
      switchTab('vps');
      toast('Signed out');
    }

    /* ================= MY VPS ================= */
    async function loadVpsList() {
      if (!STATE.user) {
        $('vps-list').innerHTML = guestEmpty('Sign in to create and manage your VPS.', 'Sign In');
        return;
      }
      const res = await api('/api/vps');
      if (!res.ok) return;
      STATE.vpsList = res.data.vps || [];
      renderVpsList();
    }

    function guestEmpty(text, btnLabel) {
      return `<div class="empty"><h3>${esc(text)}</h3><p>It takes less than a minute.</p>
        <button class="btn btn-primary" onclick="openAuth('${btnLabel === 'Sign In' ? 'login' : 'signup'}')">${btnLabel}</button></div>`;
    }

    function renderVpsList() {
      const wrap = $('vps-list');
      if (!STATE.user) return;
      if (STATE.vpsList.length === 0) {
        wrap.innerHTML = `<div class="empty"><h3>No VPS yet</h3><p>Create your first VPS to host a Discord bot.</p>
          <button class="btn btn-primary" onclick="openVpsModal()">Create VPS</button></div>`;
        return;
      }
      wrap.innerHTML = STATE.vpsList.map(v => {
        const on = v.status === 'running';
        return `
        <div class="vps-card">
          <div class="vps-main">
            <div class="vps-name"><span class="dot ${on ? 'on' : ''}"></span>${esc(v.name)}</div>
            <div class="vps-specs">
              <span>${esc(v.cpu)} · ${esc(v.memory)} · ${esc(v.storage)}</span>
              <span class="ip">${esc(v.ip)}</span>
              <span>Plan: ${esc(v.plan)}</span>
            </div>
          </div>
          <div class="vps-actions">
            <button class="btn btn-sm btn-primary" onclick="manageBot('${v.id}')">Manage Bot</button>
            ${on
              ? `<button class="btn btn-sm" onclick="vpsAction('${v.id}', 'stop')">Stop</button>`
              : `<button class="btn btn-sm" onclick="vpsAction('${v.id}', 'start')">Start</button>`}
            <button class="btn btn-sm" onclick="vpsAction('${v.id}', 'restart')">Restart</button>
            <button class="btn-icon" title="Rename" onclick="renameVps('${v.id}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            </button>
            <button class="btn-icon" title="Delete" style="color:var(--red);" onclick="deleteVps('${v.id}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>`;
      }).join('');
    }

    async function vpsAction(id, action) {
      const res = await api(`/api/vps/${id}/${action}`, { method: 'POST' });
      if (res.ok) {
        toast(action === 'start' ? 'VPS started' : action === 'stop' ? 'VPS stopped' : 'VPS restarted', 'ok');
        loadVpsList();
      } else {
        toast(res.data.error || 'Action failed', 'err');
      }
    }

    async function renameVps(id) {
      const v = STATE.vpsList.find(x => x.id === id);
      const name = await promptModal('Rename VPS', 'New name', v ? v.name : '');
      if (!name || !name.trim()) return;
      const res = await api(`/api/vps/${id}/rename`, { method: 'POST', body: { name: name.trim() } });
      if (res.ok) { toast('Renamed', 'ok'); loadVpsList(); }
      else toast(res.data.error || 'Rename failed', 'err');
    }

    async function deleteVps(id) {
      const v = STATE.vpsList.find(x => x.id === id);
      const ok = await confirmModal('Delete VPS', `Delete "${v ? v.name : 'this VPS'}" and all its files? This cannot be undone.`);
      if (!ok) return;
      const res = await api(`/api/vps/${id}`, { method: 'DELETE' });
      if (res.ok) { toast('VPS deleted', 'ok'); loadVpsList(); if (STATE.activeVpsId === id) STATE.activeVpsId = null; }
      else toast(res.data.error || 'Delete failed', 'err');
    }

    function manageBot(id) {
      STATE.activeVpsId = id;
      switchTab('bot');
    }

    /* ---- Create VPS modal ---- */
    async function openVpsModal() {
      if (!STATE.user) { openAuth('signup'); return; }
      $('vps-error').style.display = 'none';
      $('vps-name').value = '';
      if (Object.keys(STATE.plans).length === 0) {
        const res = await api('/api/plans');
        if (res.ok) STATE.plans = res.data;
      }
      const sel = $('vps-plan');
      sel.innerHTML = Object.entries(STATE.plans).map(([k, p]) =>
        `<option value="${esc(k)}">${esc(k)} — ${esc(p.cpu)}, ${esc(p.memory)}</option>`).join('');
      sel.value = 'performance';
      $('vps-backdrop').classList.add('open');
      setTimeout(() => $('vps-name').focus(), 30);
    }
    function closeVpsModal() { $('vps-backdrop').classList.remove('open'); }

    async function createVps() {
      const name = $('vps-name').value.trim();
      const plan = $('vps-plan').value;
      const btn = $('vps-create-btn');
      btn.disabled = true;
      const res = await api('/api/vps', { method: 'POST', body: { name, plan } });
      btn.disabled = false;
      if (res.ok && res.data.success) {
        closeVpsModal();
        toast('VPS created', 'ok');
        loadVpsList();
      } else {
        const el = $('vps-error');
        el.textContent = res.data.error || 'Could not create VPS.';
        el.style.display = 'block';
      }
    }

    /* ---- Hardware strip (real host data) ---- */
    async function loadHardware() {
      const res = await api('/api/hardware');
      if (!res.ok || !res.data.hardware) return;
      const h = res.data.hardware;
      $('hw-strip').style.display = '';
      $('hw-cpu').textContent = (h.cpu_cores || '?') + ' cores';
      $('hw-cpu-sub').textContent = h.cpu_model || '—';
      $('hw-ram').textContent = h.total_memory || '—';
      $('hw-ram-sub').textContent = h.free_memory ? h.free_memory + ' free' : '—';
      $('hw-platform').textContent = h.platform || '—';
      $('hw-platform-sub').textContent = h.kernel || '';
      $('hw-uptime').textContent = formatUptime(h.uptime_seconds || 0);
    }

    function formatUptime(sec) {
      if (!sec) return '—';
      const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm ' + Math.floor(sec % 60) + 's';
    }

    /* ================= DC BOTS ================= */
    function loadBotTab() {
      stopLogPolling();
      if (STATE.statusTimer) { clearInterval(STATE.statusTimer); STATE.statusTimer = null; }

      const empty = $('bot-empty');
      const body = $('bot-body');

      if (!STATE.user) {
        body.style.display = 'none';
        empty.innerHTML = guestEmpty('Sign in to manage your Discord bots.', 'Sign In');
        return;
      }
      if (STATE.vpsList.length === 0) {
        body.style.display = 'none';
        empty.innerHTML = `<div class="empty"><h3>No VPS yet</h3><p>Create a VPS first, then upload your bot files.</p>
          <button class="btn btn-primary" onclick="openVpsModal()">Create VPS</button></div>`;
        return;
      }
      empty.innerHTML = '';
      body.style.display = '';

      if (!STATE.activeVpsId || !STATE.vpsList.find(v => v.id === STATE.activeVpsId)) {
        STATE.activeVpsId = STATE.vpsList[0].id;
      }
      const sel = $('bot-vps-select');
      sel.innerHTML = STATE.vpsList.map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('');
      sel.value = STATE.activeVpsId;

      loadBotState();
      loadFiles();
      startLogPolling();
      STATE.statusTimer = setInterval(() => { if (STATE.tab === 'bot') loadBotState(true); }, 5000);
    }

    function setBotVps(id) {
      STATE.activeVpsId = id;
      STATE.editorPath = null;
      $('editor-card').style.display = 'none';
      loadBotState();
      loadFiles();
    }

    async function loadBotState(silent = false) {
      if (!STATE.activeVpsId) return;
      const res = await api(`/api/vps/${STATE.activeVpsId}/bot`);
      if (!res.ok) { if (!silent) toast(res.data.error || 'Failed to load bot', 'err'); return; }
      STATE.bot = res.data.bot;
      renderBotStatus();
      const b = STATE.bot;
      const script = $('bot-script');
      if (document.activeElement !== script && b.filename) script.value = b.filename;
      const rt = $('bot-runtime');
      if (b.runtime && document.activeElement !== rt) rt.value = b.runtime;
      $('bot-token-type').value = b.token_type === 'user' ? 'user' : 'bot';
      $('token-hint').textContent = b.token ? 'A token is saved. Leave empty to reuse it.' : 'Left empty, the saved token is used.';
    }

    function renderBotStatus() {
      const b = STATE.bot || {};
      const dot = $('bot-status-dot');
      const txt = $('bot-status-text');
      const up = $('bot-uptime-text');
      const running = b.status === 'running' && b.running;
      dot.className = 'dot' + (running ? ' on' : b.status === 'error' ? ' err' : '');
      txt.textContent = running ? 'Running' : b.status === 'error' ? 'Error' : 'Stopped';
      if (running && b.uptime_seconds) {
        up.style.display = '';
        up.textContent = 'Uptime ' + formatUptime(b.uptime_seconds) + (b.pid ? ' · PID ' + b.pid : '');
      } else {
        up.style.display = 'none';
      }
      $('btn-start').disabled = running;
      $('btn-stop').disabled = !running;
      $('btn-restart').disabled = false;
    }

    function toggleToken() {
      const t = $('bot-token');
      const show = t.type === 'password';
      t.type = show ? 'text' : 'password';
      $('token-eye').textContent = show ? 'Hide' : 'Show';
    }

    async function startBot() {
      const body = {
        filename: $('bot-script').value.trim() || 'bot.py',
        runtime: $('bot-runtime').value,
        token_type: $('bot-token-type').value,
      };
      const tok = $('bot-token').value.trim();
      if (tok) body.token = tok;
      const btn = $('btn-start');
      btn.disabled = true;
      const res = await api(`/api/vps/${STATE.activeVpsId}/bot/start`, { method: 'POST', body });
      btn.disabled = false;
      if (res.ok) {
        toast('Bot started', 'ok');
        if (tok) $('bot-token').value = '';
        loadBotState();
      } else toast(res.data.error || 'Failed to start bot', 'err');
    }

    async function restartBot() {
      const body = {
        filename: $('bot-script').value.trim() || 'bot.py',
        runtime: $('bot-runtime').value,
      };
      const tok = $('bot-token').value.trim();
      if (tok) { body.token = tok; body.token_type = $('bot-token-type').value; }
      const btn = $('btn-restart');
      btn.disabled = true;
      const res = await api(`/api/vps/${STATE.activeVpsId}/bot/restart`, { method: 'POST', body });
      btn.disabled = false;
      if (res.ok) { toast('Bot restarted', 'ok'); if (tok) $('bot-token').value = ''; loadBotState(); }
      else toast(res.data.error || 'Failed to restart bot', 'err');
    }

    async function stopBot() {
      const btn = $('btn-stop');
      btn.disabled = true;
      const res = await api(`/api/vps/${STATE.activeVpsId}/bot/stop`, { method: 'POST' });
      btn.disabled = false;
      if (res.ok) { toast('Bot stopped', 'ok'); loadBotState(); }
      else toast(res.data.error || 'Failed to stop bot', 'err');
    }

    /* ---- Upload ---- */
    function uploadFiles(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;
      if (!STATE.user) { openAuth('signup'); return; }
      if (!STATE.activeVpsId) { toast('Create a VPS first.', 'err'); return; }

      const total = files.reduce((a, f) => a + f.size, 0);
      toast(`Uploading ${files.length} file(s) (${(total / 1048576).toFixed(2)} MB)…`);
      const fd = new FormData();
      files.forEach(f => fd.append('files', f));

      const btns = ['btn-start', 'btn-stop', 'btn-restart'].map(id => $(id));
      btns.forEach(b => b.disabled = true);
      api(`/api/vps/${STATE.activeVpsId}/bot/upload`, { method: 'POST', body: fd })
        .then(res => {
          if (res.ok && res.data.success) {
            toast(res.data.message || 'Upload complete', 'ok');
            const d = res.data;
            if (d.detected_entry) {
              $('bot-script').value = d.detected_entry;
              if (d.detected_runtime) $('bot-runtime').value = d.detected_runtime;
            }
            loadFiles();
            loadBotState(true);
          } else {
            toast(res.data.error || 'Upload failed', 'err');
          }
        })
        .finally(() => { btns.forEach(b => b.disabled = false); loadBotState(true); });
    }

    // Drag & drop
    (function () {
      const dz = $('dropzone');
      ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
      dz.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
    })();

    /* ---- Files ---- */
    async function loadFiles() {
      if (!STATE.activeVpsId) return;
      const res = await api(`/api/vps/${STATE.activeVpsId}/files`);
      if (!res.ok) return;
      STATE.files = res.data.files || [];
      renderTree();
    }

    function buildTree(files) {
      const root = { name: '', children: new Map(), isFile: false };
      for (const f of files) {
        const parts = f.name.split('/');
        let node = root;
        parts.forEach((p, i) => {
          if (!node.children.has(p)) node.children.set(p, { name: p, children: new Map(), isFile: false, meta: null });
          node = node.children.get(p);
          if (i === parts.length - 1) { node.isFile = !f.isDirectory; node.meta = f; }
        });
      }
      return root;
    }

    function sortedChildren(node) {
      return Array.from(node.children.values()).sort((a, b) =>
        a.isFile === b.isFile ? a.name.localeCompare(b.name) : a.isFile ? 1 : -1);
    }

    function renderTree() {
      const root = buildTree(STATE.files);
      const kids = sortedChildren(root);
      const wrap = $('file-tree');
      if (kids.length === 0) {
        wrap.innerHTML = '<div class="tree-empty">No files yet. Upload files or zip bundles above.</div>';
        return;
      }
      let html = '';
      const walk = (node, depth) => {
        for (const child of sortedChildren(node)) {
          const path = child.name;
          if (child.isFile) {
            const selected = STATE.editorPath === path ? ' selected' : '';
            html += `<div class="tree-row${selected}" data-path="${esc(path)}" style="padding-left:${8 + depth * 16}px;">
              <span style="color:var(--dim); font-size:11px; font-family:var(--mono);">›</span>
              <span class="t-name">${esc(child.name)}</span>
              <span class="t-meta">${formatBytes(child.meta ? child.meta.size : 0)}</span>
              <span class="t-actions">
                <button class="btn-icon" title="Download" onclick="event.stopPropagation(); downloadFile('${esc(path)}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <button class="btn-icon" title="Delete" style="color:var(--red);" onclick="event.stopPropagation(); deleteItem('${esc(path)}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </span>
            </div>`;
          } else {
            const collapsed = STATE.collapsed.has(path);
            html += `<div class="tree-row" data-dir="${esc(path)}" style="padding-left:${8 + depth * 16}px;" onclick="toggleDir('${esc(path)}')">
              <span style="font-size:11px; width:12px; display:inline-block; text-align:center;">${collapsed ? '▸' : '▾'}</span>
              <span class="t-name" style="font-weight:500;">${esc(child.name)}/</span>
              <span class="t-actions">
                <button class="btn-icon" title="Delete" style="color:var(--red);" onclick="event.stopPropagation(); deleteItem('${esc(path)}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </span>
            </div>`;
            if (!collapsed) walk(child, depth + 1);
          }
        }
      };
      walk(root, 0);
      wrap.innerHTML = html;
      wrap.querySelectorAll('.tree-row[data-path]').forEach(row => {
        row.onclick = () => openFile(row.dataset.path);
      });
    }

    function toggleDir(path) {
      if (STATE.collapsed.has(path)) STATE.collapsed.delete(path);
      else STATE.collapsed.add(path);
      renderTree();
    }

    async function openFile(path) {
      const res = await api(`/api/vps/${STATE.activeVpsId}/file?path=${encodeURIComponent(path)}`);
      if (!res.ok) { toast(res.data.error || 'Could not open file', 'err'); return; }
      STATE.editorPath = path;
      STATE.editorDirty = false;
      $('editor-fname').textContent = path;
      $('file-editor').value = res.data.content || '';
      $('editor-dirty').classList.remove('show');
      $('editor-card').style.display = '';
      renderTree();
      $('editor-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function markDirty() {
      STATE.editorDirty = true;
      $('editor-dirty').classList.add('show');
    }

    async function saveEditorFile() {
      if (!STATE.editorPath) return;
      const res = await api(`/api/vps/${STATE.activeVpsId}/file`, {
        method: 'POST',
        body: { path: STATE.editorPath, content: $('file-editor').value }
      });
      if (res.ok) {
        STATE.editorDirty = false;
        $('editor-dirty').classList.remove('show');
        toast('Saved ' + STATE.editorPath, 'ok');
        loadFiles();
      } else toast(res.data.error || 'Save failed', 'err');
    }

    function closeEditor() {
      STATE.editorPath = null;
      STATE.editorDirty = false;
      $('editor-card').style.display = 'none';
      $('editor-dirty').classList.remove('show');
      renderTree();
    }

    async function deleteEditorFile() {
      if (!STATE.editorPath) return;
      const path = STATE.editorPath;
      const ok = await confirmModal('Delete File', `Delete "${path}"?`);
      if (ok) { await deleteItem(path); closeEditor(); }
    }

    async function newFile() {
      const path = await promptModal('New File', 'e.g. bot.py or cogs/hello.py');
      if (!path || !path.trim()) return;
      const p = path.trim().replace(/^\/+/, '');
      const res = await api(`/api/vps/${STATE.activeVpsId}/file`, { method: 'POST', body: { path: p, content: '' } });
      if (res.ok) { toast('Created ' + p, 'ok'); loadFiles(); openFile(p); }
      else toast(res.data.error || 'Could not create file', 'err');
    }

    async function newFolder() {
      const path = await promptModal('New Folder', 'e.g. cogs');
      if (!path || !path.trim()) return;
      const p = path.trim().replace(/^\/+/, '');
      const res = await api(`/api/vps/${STATE.activeVpsId}/folder`, { method: 'POST', body: { path: p } });
      if (res.ok) { toast('Created ' + p, 'ok'); loadFiles(); }
      else toast(res.data.error || 'Could not create folder', 'err');
    }

    async function deleteItem(path) {
      const ok = await confirmModal('Delete', `Delete "${path}"? This cannot be undone.`);
      if (!ok) return;
      const res = await api(`/api/vps/${STATE.activeVpsId}/file?path=${encodeURIComponent(path)}`, { method: 'DELETE' });
      if (res.ok) { toast('Deleted', 'ok'); loadFiles(); }
      else toast(res.data.error || 'Delete failed', 'err');
    }

    function downloadFile(path) {
      const key = (STATE.user && STATE.user.api_key) || localStorage.getItem('cloudvps_key') || '';
      window.open(`/api/vps/${STATE.activeVpsId}/file/download?path=${encodeURIComponent(path)}&api_key=${encodeURIComponent(key)}`, '_blank');
    }

    /* ---- Logs ---- */
    function startLogPolling() {
      stopLogPolling();
      loadLogs();
      STATE.logTimer = setInterval(loadLogs, 2500);
    }
    function stopLogPolling() {
      if (STATE.logTimer) { clearInterval(STATE.logTimer); STATE.logTimer = null; }
    }

    async function loadLogs() {
      if (STATE.tab !== 'bot' || !STATE.activeVpsId) return;
      const res = await api(`/api/vps/${STATE.activeVpsId}/bot/logs`);
      if (!res.ok) return;
      const box = $('log-box');
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.textContent = (res.data.logs || []).slice(-250).join('\n');
      if (atBottom) box.scrollTop = box.scrollHeight;
      if (res.data.status && STATE.bot) {
        STATE.bot.status = res.data.status.status;
        STATE.bot.running = res.data.status.running;
        STATE.bot.uptime_seconds = res.data.status.uptime_seconds;
        renderBotStatus();
      }
    }

    async function clearLogs() {
      const res = await api(`/api/vps/${STATE.activeVpsId}/bot/logs/clear`, { method: 'POST' });
      if (res.ok) { $('log-box').textContent = ''; toast('Logs cleared', 'ok'); }
    }

    /* ================= ACCOUNT ================= */
    function renderAccount() {
      const wrap = $('account-body');
      if (!STATE.user) {
        wrap.innerHTML = `<div class="card">
          <div class="card-title">Account</div>
          <p style="font-size:13.5px; color:var(--muted); margin-bottom:14px;">Sign in to manage your account.</p>
          <div style="display:flex; gap:8px;">
            <button class="btn" onclick="openAuth('login')">Sign In</button>
            <button class="btn btn-primary" onclick="openAuth('signup')">Create Account</button>
          </div>
        </div>`;
        return;
      }
      const created = STATE.user.created_at ? new Date(STATE.user.created_at).toLocaleDateString() : '—';
      wrap.innerHTML = `
        <div class="card">
          <div class="card-title">Account</div>
          <div class="account-row"><span class="k">Username</span><span class="v" style="font-family:inherit;">${esc(STATE.user.username)}</span></div>
          <div class="account-row"><span class="k">VPS Count</span><span class="v">${STATE.vpsList.length}</span></div>
          <div class="account-row"><span class="k">Member Since</span><span class="v" style="font-family:inherit;">${esc(created)}</span></div>
        </div>
        <div class="card">
          <div class="card-title">API Key</div>
          <div class="account-row">
            <span class="k">Key</span>
            <span style="display:flex; gap:6px; align-items:center;">
              <span class="v" id="api-key-value">${esc(maskKey(STATE.user.api_key || ''))}</span>
              <button class="btn btn-sm" onclick="revealKey()">Reveal</button>
              <button class="btn btn-sm" onclick="copyKey()">Copy</button>
            </span>
          </div>
          <div class="hint">Use this key for API access. Anyone with it can control your VPS.</div>
        </div>
        <div class="card">
          <div class="card-title" style="margin-bottom:8px;">Session</div>
          <button class="btn btn-danger" onclick="signOut()">Sign Out</button>
        </div>`;
    }

    function maskKey(k) {
      if (!k) return '—';
      return k.slice(0, 7) + '…' + k.slice(-4);
    }
    function revealKey() {
      $('api-key-value').textContent = STATE.user.api_key || '';
    }
    async function copyKey() {
      const key = STATE.user.api_key || '';
      try {
        await navigator.clipboard.writeText(key);
        toast('API key copied', 'ok');
      } catch (e) {
        revealKey();
        const el = $('api-key-value');
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        toast('Key revealed — select and copy manually');
      }
    }

    /* ================= HELPERS ================= */
    function formatBytes(n) {
      if (!n || n <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
      return (n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    /* ================= BOOT ================= */
    async function boot() {
      renderSidebar();
      const res = await api('/api/session');
      if (res.ok && res.data.authenticated && res.data.user) {
        STATE.user = res.data.user;
        renderSidebar();
      }
      const plansRes = await api('/api/plans');
      if (plansRes.ok) STATE.plans = plansRes.data;
      switchTab('vps');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeAuth();
        closeVpsModal();
      }
    });

    boot();
  </script>
</body>
</html>
