openapi: 3.0.3
info:
  title: CloudVPS API
  description: |
    CloudVPS - Real VPS hosting platform with Discord bot hosting, interactive terminal, and process manager.
    
    ## Authentication
    All authenticated endpoints require an API key passed via:
    - `X-API-Key` header
    - `Authorization: Bearer <key>` header
    - `api_key` query parameter
    - `api_key` cookie
    
    ## Rate Limiting
    API requests are limited to 100 requests per 15 minutes per IP.
  version: 1.0.0
  contact:
    name: CloudVPS
    url: https://cloudvps.app
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.cloudvps.app
    description: Production server
tags:
  - name: Health
    description: Health check and service info endpoints
  - name: Plans
    description: VPS plan catalog
  - name: Authentication
    description: User registration, login, and session management
  - name: VPS Management
    description: VPS instance lifecycle management
  - name: File Manager
    description: File operations in VPS workspace
  - name: Discord Bot
    description: Discord bot process management
  - name: Terminal
    description: Command execution in VPS
  - name: GitHub
    description: GitHub repository integration
  - name: Hardware
    description: Hardware info and benchmarks
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service health status and Docker connectivity
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/plans:
    get:
      tags: [Plans]
      summary: List available VPS plans
      responses:
        '200':
          description: List of plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
  /api/backend-info:
    get:
      tags: [Health]
      summary: Backend info
      responses:
        '200':
          description: Backend information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendInfoResponse'
  /api/session:
    get:
      tags: [Authentication]
      summary: Get current session
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/register:
    post:
      tags: [Authentication]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/login:
    post:
      tags: [Authentication]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/repos/saved:
    get:
      tags: [Authentication]
      summary: List saved repositories (remembered forever)
      description: >-
        Returns every repository saved to the persistent database. Pinned
        entries (kers0ne/1LuhhCrim) are always returned first and can never
        be removed.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Saved repository list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  repos:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        repo: { type: string }
                        url: { type: string }
                        pinned: { type: boolean }
                        saved_at: { type: string }
    post:
      tags: [Authentication]
      summary: Save a repository forever
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  description: 'user/repo or a full GitHub URL'
      responses:
        '201':
          description: Repository saved
        '400':
          description: Invalid repository name
  /api/repos/saved/{repo_id}:
    delete:
      tags: [Authentication]
      summary: Remove a saved repository
      description: Pinned repositories can never be removed.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: repo_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed
        '403':
          description: Repository is pinned
        '404':
          description: Not found
  /api/vps:
    get:
      tags: [VPS Management]
      summary: List user's VPS instances
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of VPS instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpsListResponse'
        '401':
          description: Authentication required
    post:
      tags: [VPS Management]
      summary: Create new VPS
      description: >-
        Creates a VPS and saves it to the persistent database. Unless
        auto_install is false, the Discord package stack (discord.py +
        common python libraries, discord.js + dotenv) is installed into the
        workspace automatically in the background; progress streams to the
        bot logs and the package ledger is persisted with the VPS.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVpsRequest'
      responses:
        '201':
          description: VPS created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpsResponse'
        '400':
          description: Validation error
        '401':
          description: Authentication required
  /api/vps/{vps_id}:
    get:
      tags: [VPS Management]
      summary: Get VPS details
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpsResponse'
        '404':
          description: VPS not found
  /api/vps/{vps_id}/start:
    post:
      tags: [VPS Management]
      summary: Start VPS
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /api/vps/{vps_id}/stop:
    post:
      tags: [VPS Management]
      summary: Stop VPS
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /api/vps/{vps_id}/restart:
    post:
      tags: [VPS Management]
      summary: Restart VPS
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /api/vps/{vps_id}/stats:
    get:
      tags: [VPS Management]
      summary: Get VPS stats
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpsStatsResponse'
  /api/vps/{vps_id}/files:
    get:
      tags: [File Manager]
      summary: List files in VPS workspace
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
  /api/vps/{vps_id}/file:
    get:
      tags: [File Manager]
      summary: Read file
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
            default: bot.py
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContentResponse'
    post:
      tags: [File Manager]
      summary: Write file
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
      responses:
        '200':
          description: File saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      tags: [File Manager]
      summary: Delete file
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/vps/{vps_id}/bot:
    get:
      tags: [Discord Bot]
      summary: Get bot status
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotStatusResponse'
    post:
      tags: [Discord Bot]
      summary: Update bot config
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConfigRequest'
      responses:
        '200':
          description: Config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotConfigResponse'
  /api/vps/{vps_id}/bot/start:
    post:
      tags: [Discord Bot]
      summary: Start bot process
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotStartRequest'
      responses:
        '200':
          description: Bot started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotActionResponse'
  /api/vps/{vps_id}/bot/stop:
    post:
      tags: [Discord Bot]
      summary: Stop bot process
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/vps/{vps_id}/bot/restart:
    post:
      tags: [Discord Bot]
      summary: Restart bot process
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotStartRequest'
      responses:
        '200':
          description: Bot restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotActionResponse'
  /api/vps/{vps_id}/bot/logs:
    get:
      tags: [Discord Bot]
      summary: Get bot logs
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bot logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotLogsResponse'
  /api/vps/{vps_id}/terminal/exec:
    post:
      tags: [Terminal]
      summary: Execute command in VPS
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalExecRequest'
      responses:
        '200':
          description: Command output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalExecResponse'
  /api/vps/{vps_id}/github/clone:
    post:
      tags: [GitHub]
      summary: Clone GitHub repository
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubCloneRequest'
      responses:
        '200':
          description: Repository cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubCloneResponse'
  /api/vps/{vps_id}/packages/list:
    get:
      tags: [Packages]
      summary: List installed packages (persisted ledger)
      description: >-
        Returns the persisted per-VPS package ledger — python packages
        (pip-installed and requirements.txt entries) and node packages
        (workspace package.json), plus the Discord-stack auto-install state.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  python:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        version: { type: string }
                        auto: { type: boolean, description: Part of the automatic Discord stack }
                  node:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        version: { type: string }
                        auto: { type: boolean }
                  auto_install:
                    $ref: '#/components/schemas/AutoInstallState'
  /api/vps/{vps_id}/packages/install:
    post:
      tags: [Packages]
      summary: Install packages (pip or npm)
      description: >-
        Installs one or more space-separated packages into the VPS workspace
        (pip for python, npm --save for node) and records them in the
        persisted package ledger. Python packages are also pinned into
        requirements.txt so they are re-installed automatically if missing.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packages:
                  type: string
                  description: Space-separated package names (e.g. "discord.py aiohttp")
                runtime:
                  type: string
                  enum: [python, node]
                  default: python
      responses:
        '200':
          description: Packages installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: No packages specified
        '500':
          description: Install failed
  /api/vps/{vps_id}/packages/uninstall:
    post:
      tags: [Packages]
      summary: Uninstall a package
      description: Removes the package from the VPS and from the persisted ledger.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                package:
                  type: string
                runtime:
                  type: string
                  enum: [python, node]
                  default: python
      responses:
        '200':
          description: Package removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /api/vps/{vps_id}/packages/auto-install:
    post:
      tags: [Packages]
      summary: Run the Discord-stack auto-installer
      description: >-
        Starts (or re-runs with force=true) the automatic install of the
        Discord package stack — discord.py, python-dotenv, aiohttp, requests,
        psutil, colorama (pip) and discord.js, dotenv (npm). Runs in the
        background; progress streams to the bot logs and the ledger is saved
        with the VPS. Interrupted installs are retried automatically on boot.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: true
                  description: Reinstall even if a previous run completed
      responses:
        '200':
          description: Install started in the background
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  auto_install:
                    $ref: '#/components/schemas/AutoInstallState'
  /api/vps/{vps_id}/packages/install-bundle:
    post:
      tags: [Packages]
      summary: Install a software bundle or runtime
      description: >-
        Installs a predefined bundle. The "discord" bundle delegates to the
        persisted Discord-stack auto-installer (python + node).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bundle:
                  type: string
                  enum: [discord, lune, python, luau-env, system, custom]
                custom_cmd:
                  type: string
                  description: Shell command to run when bundle is "custom"
      responses:
        '200':
          description: Bundle install started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: Unknown bundle
  /api/vps/{vps_id}/packages/status:
    get:
      tags: [Packages]
      summary: Runtimes, tools and Discord-stack status
      description: >-
        Reports installed runtimes (lune, python, node), system tools, and
        the persisted Discord-stack ledger/auto-install state for the VPS.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: vps_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime and package status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  runtimes:
                    type: object
                  discord_stack:
                    type: object
                    properties:
                      auto_install:
                        $ref: '#/components/schemas/AutoInstallState'
                      python:
                        type: array
                        items:
                          type: object
                      node:
                        type: array
                        items:
                          type: object
  /api/hardware:
    get:
      tags: [Hardware]
      summary: Get hardware info
      responses:
        '200':
          description: Hardware information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareResponse'
  /api/hardware/benchmark:
    post:
      tags: [Hardware]
      summary: Run benchmark
      responses:
        '200':
          description: Benchmark results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkResponse'
  /api/hardware/cgnat-tunnel:
    post:
      tags: [Hardware]
      summary: Create CGNAT tunnel
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Tunnel info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        docker:
          type: boolean
        native_ready:
          type: boolean
        engine:
          type: string
        detail:
          type: string
        image:
          type: string
        plans:
          type: array
          items:
            type: string
    PlansResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Plan'
    Plan:
      type: object
      properties:
        cpu:
          type: string
        memory:
          type: string
        storage:
          type: string
        price:
          type: string
        tier:
          type: string
    BackendInfoResponse:
      type: object
      properties:
        backend_url:
          type: string
        status:
          type: string
        runtime:
          type: string
        speed:
          type: string
        version:
          type: string
    SessionResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        api_key:
          type: string
        vps_count:
          type: integer
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 128
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        api_key:
          type: string
        user_id:
          type: string
        username:
          type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
        code:
          type: string
        details:
          type: array
          items:
            type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        status:
          type: string
    VpsListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        vps:
          type: array
          items:
            $ref: '#/components/schemas/Vps'
    VpsResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        vps:
          $ref: '#/components/schemas/Vps'
    Vps:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        plan:
          type: string
        status:
          type: string
        cpu:
          type: string
        memory:
          type: string
        storage:
          type: string
        ip:
          type: string
        container_id:
          type: string
        engine:
          type: string
        created_at:
          type: string
          format: date-time
    CreateVpsRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        plan:
          type: string
          enum: [starter, standard, performance, ultra]
          default: performance
        os:
          type: string
          default: ubuntu
        auto_install:
          type: boolean
          default: true
          description: >-
            Automatically install the Discord package stack (discord.py,
            python-dotenv, aiohttp, requests, psutil, colorama via pip and
            discord.js, dotenv via npm) into the new VPS workspace in the
            background. Installed packages are persisted with the VPS.
    AutoInstallState:
      type: object
      description: Persisted state of the automatic Discord-stack installer for a VPS
      properties:
        status:
          type: string
          enum: [pending, queued, running, done, failed, disabled]
        queued_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        stack:
          type: object
          properties:
            python:
              type: array
              items:
                type: string
            node:
              type: array
              items:
                type: string
